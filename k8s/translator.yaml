apiVersion: apps/v1
kind: Deployment
metadata:
  name: translator-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: translator
  template:
    metadata:
      labels:
        app: translator
    spec:
      containers:
      - name: translator
        # Replace 'rag-project' if you named your artifact registry repository something else
        image: us-central1-docker.pkg.dev/YOUR_PROJECT_ID/rag-project/translator:v1
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: translator-service
spec:
  selector:
    app: translator
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP